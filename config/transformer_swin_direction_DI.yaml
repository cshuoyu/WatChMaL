gpu_list:
  - 1 
seed: 42
dump_path: './outputs/'
model:
  num_output_channels: 3
defaults:
  - data: hk_split_di
  - data/dataset: hk_dit2tvit
  - model: transformer_swindi
  - engine: regression_DI
 # - tasks/restore_state: restore_state_tr
