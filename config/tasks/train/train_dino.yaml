defaults:
 - /optimizers: muon
 - /loss: dino
 - /data_loaders:
   - train
   - validation
epochs: 40
val_interval: 50
num_val_batches: 4
checkpointing: false
max_steps: null
data_loaders:
  train:
    split_key: train_idxs
    batch_size: 64
    num_workers: 8
  validation:
    split_key: val_idxs
    batch_size: 64
    num_workers: 8
    drop_last: true
